# Config-as-code for the primary API service (service name may differ in Railway UI).
# Path is always repo root — Root Directory in Railway must stay "/" (not apps/api).
# Other services (web, admin, workers): copy build/start from infra/railway/services.json.

[build]
builder = "nixpacks"
# Nixpacks already runs `npm ci` in the install phase — do not run it again here (EBUSY on node_modules/.cache).
buildCommand = "npm run build -w @brand2school/api"

[deploy]
preDeployCommand = "npm run railway:migrate"
startCommand = "npm run start -w @brand2school/api"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
